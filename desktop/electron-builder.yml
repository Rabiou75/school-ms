appId: cm.schoolms.desktop
productName: School MS
copyright: Copyright 2026 ETS IUTECH CONSULTING

directories:
  output: dist
  buildResources: build

files:
  - main.js
  - splash.html
  - setup.html
  - setup-preload.js
  - package.json

extraResources:
  - from: ../vendor/node
    to: runtime/node
  - from: embed
    to: runtime
  - from: build/vc_redist.x64.exe
    to: vc_redist.x64.exe

asar: false

win:
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]

nsis:
  runAfterFinish: false
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: School MS
  include: build/installer.nsh