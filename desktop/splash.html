<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  body {
    margin: 0; padding: 0;
    font-family: -apple-system, 'Segoe UI', Roboto, sans-serif;
    background: linear-gradient(135deg, #0f766e 0%, #0d6f6a 100%);
    color: white;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    height: 100vh; user-select: none; -webkit-app-region: drag;
  }
  .logo { font-size: 36px; font-weight: 700; letter-spacing: 2px; margin-bottom: 12px; }
  .sub { font-size: 13px; opacity: 0.8; margin-bottom: 30px; }
  .spinner {
    width: 32px; height: 32px;
    border: 3px solid rgba(255,255,255,0.25);
    border-top-color: white;
    border-radius: 50%;
    animation: spin 0.9s linear infinite;
    margin-bottom: 16px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  #status { font-size: 12px; opacity: 0.9; min-height: 18px; }
  .version { position: absolute; bottom: 12px; font-size: 10px; opacity: 0.5; }
</style>
</head>
<body>
  <div class="logo">School MS</div>
  <div class="sub">School Management System</div>
  <div class="spinner"></div>
  <div id="status">Starting...</div>
  <div class="version">v1.0.0</div>
  <script>
    window.setStatus = function(s) { document.getElementById('status').textContent = s; };
  </script>
</body>
</html>
